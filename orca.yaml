# Orca (https://orca.dev) repo hooks. See docs/adr/0001-per-worktree-runtime-config.md.
#
# Where Orca reads each hook from (verified with Orca 1.4):
#   - setup:   this file in the NEW worktree's checkout (so it must be committed on the
#              base branch), run inside the new worktree.
#   - archive: this file in the MAIN checkout, run inside the worktree being removed,
#              which may predate the teardown script.
scripts:
  # Gives the worktree its own ports and Temporal namespace, then installs dependencies.
  setup: ./scripts/worktree-setup.sh
  # Deletes the worktree's Temporal namespace. Must never fail: a failing archive hook
  # blocks the worktree removal.
  archive: |
    if [ -x ./scripts/worktree-teardown.sh ]; then
      ./scripts/worktree-teardown.sh
    else
      echo "[worktree-teardown] no teardown script in this checkout, skipping"
    fi
