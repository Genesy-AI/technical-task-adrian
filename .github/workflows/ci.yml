# Deterministic checks for every PR. Each step runs one check of scripts/ci.sh, so a
# failure points at the exact check, and `scripts/ci.sh` runs the same thing locally.
name: CI

on:
  pull_request:
    # "edited" re-checks the PR title when it is renamed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: PR title
        env:
          # Via env, never interpolated into the script: the title is user input.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh --header "$PR_TITLE"
      - name: Commit messages
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci.sh commits conventional

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.nvmrc
      - name: Lead template fields match
        run: scripts/ci.sh contracts lead-template-fields

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json
          cache: true
          cache_dependency_path: backend/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.nvmrc
      - name: Install
        run: scripts/ci.sh backend install
      - name: Generate Prisma client
        run: scripts/ci.sh backend prisma
      - name: Format
        run: scripts/ci.sh backend format
      - name: Build
        run: scripts/ci.sh backend build
      - name: Test
        run: scripts/ci.sh backend test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install
        run: scripts/ci.sh frontend install
      - name: Format
        run: scripts/ci.sh frontend format
      - name: Lint
        run: scripts/ci.sh frontend lint
      - name: Build
        run: scripts/ci.sh frontend build
      - name: Test
        run: scripts/ci.sh frontend test
