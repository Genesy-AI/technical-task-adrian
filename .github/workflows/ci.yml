# Deterministic checks for every PR. The checks themselves live in scripts/ci.sh, so
# `scripts/ci.sh` runs exactly the same thing locally.
name: CI

on:
  pull_request:
    # "edited" re-checks the PR title when it is renamed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: PR title
        env:
          # Via env, never interpolated into the script: the title is user input.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh --header "$PR_TITLE"
      - name: Commits
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci.sh commits

  checks:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.package }}/package.json
          cache: true
          cache_dependency_path: ${{ matrix.package }}/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.package }}/.nvmrc
      - run: scripts/ci.sh ${{ matrix.package }}
